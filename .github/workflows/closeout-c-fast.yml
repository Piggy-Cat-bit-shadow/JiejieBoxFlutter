name: closeout-c-fast

# Fast Swift compile loop for the iOS app and the Packet Tunnel extension.
# Reuses a known-good Libbox.xcframework produced by an earlier kernel run so a
# Swift edit does not rebuild the whole core. The full closeout-c workflow still
# owns the from-source kernel build and the other platforms.
on:
  push:
    branches:
      - feat/ui-closeout-c-20261118
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: '3.47.6'
  FRAMEWORK_RUN: '44221339531'

jobs:
  ios-fast:
    name: iOS app + extension compile (prebuilt framework)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Download prebuilt Libbox
        uses: actions/download-artifact@v4
        with:
          name: Libbox.xcframework
          run-id: 44221339531
          github-token: ${{ github.token }}
          path: ios/Frameworks/Libbox.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Inspect generated scheme
        run: |
          sed -n '1,120p' ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme || true
          grep -n 'BlueprintName\|BuildableName\|BlueprintIdentifier' ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme || true
      - name: Build unsigned iOS app + extension
        run: flutter build ios --release --no-codesign
      - name: Full Xcode diagnostics
        if: failure()
        run: |
          cd ios
          echo '=== native targets ==='
          grep -n -A8 'isa = PBXNativeTarget' Runner.xcodeproj/project.pbxproj | head -80 || true
          echo '=== scheme references ==='
          grep -n 'BlueprintIdentifier\|BlueprintName' Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme || true
          tar czf "$RUNNER_TEMP/xcode-project.tgz" Runner.xcodeproj
      - name: Upload Xcode project for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: ${{ runner.temp }}/xcode-project.tgz
          if-no-files-found: warn
      - name: Inspect embedded extension
        run: |
          app="build/ios/iphoneos/Runner.app"
          ls -la "$app"
          ls -la "$app/PlugIns" || true
          test -d "$app/PlugIns/JjboxTunnel.appex"
      - name: Upload app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: warn
