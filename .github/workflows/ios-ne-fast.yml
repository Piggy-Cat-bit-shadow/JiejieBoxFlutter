name: ios-ne-fast

# Compile-only iteration for the NetworkExtension target. Reuses the known-good
# Libbox.xcframework artifact instead of rebuilding the kernel on every Swift
# edit. The release workflow (ios-ne.yml) rebuilds the framework from source.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p7-final
    paths:
      - '.github/workflows/ios-ne-fast.yml'
      - 'ios/**'
      - 'lib/core/**'
      - 'packages/jjbox_bridge/**'

permissions:
  contents: read
  actions: read

jobs:
  build-ios:
    name: Fast iOS NE compile
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FRAMEWORK_RUN: '44221339531'
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve packages before XcodeGen
        run: flutter pub get

      - name: Download prebuilt Libbox
        run: |
          gh run download "$FRAMEWORK_RUN" -n Libbox.xcframework \
            -D ios/Frameworks/Libbox.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          grep -n 'NetworkExtension' Runner.xcodeproj/project.pbxproj | head -40 || true
          xcodebuild -project Runner.xcodeproj -target NetworkExtension -showBuildSettings 2>/dev/null | grep -E 'SDKROOT|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS|PRODUCT_NAME' || true

      - name: Build unsigned app
        run: |
          flutter build ios --release --no-codesign
