name: jiejiebox_flutter
description: JiejieBox 五平台客户端（FlClash v0.9.3 Prism UI 保真底座）
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  prism_ui:
    path: third_party/prism_ui
  jjbox_bridge:
    path: packages/jjbox_bridge
  intl: any
  collection: ^1.19.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    # Flutter's SPM migration hard-codes the Flutter-template Runner target id
    # (97C146ED1CF9000F007C117D); an XcodeGen project has generated ids, so the
    # migration aborts before xcodebuild. This app has no Swift packages, so the
    # project explicitly keeps CocoaPods/plain Xcode builds.
    enable-swift-package-manager: false
  uses-material-design: false
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
